<svg xmlns="http://www.w3.org/2000/svg" class="dvz-schematic" viewBox="0 0 320 340" role="img" aria-labelledby="camera-view-title camera-view-desc">
<title id="camera-view-title">World coordinates become view coordinates</title>
<desc id="camera-view-desc">The cube and camera keep the same separation. In world coordinates the cube center is the origin. In view coordinates the camera is the origin and the cube is in front of it.</desc>
<g font-family="system-ui, sans-serif" font-size="14">
<rect x="0" y="0" width="320" height="340" rx="4" fill="var(--md-code-bg-color, #f5f7fa)" stroke="none"/>
<text x="20" y="28" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="start" font-weight="600">3. View space</text>
<text x="20" y="62" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="start" font-weight="600">World coordinates</text>
<line x1="48" y1="107" x2="278" y2="107" stroke="var(--md-default-fg-color--lighter, #8593a6)" stroke-width="1.5"/>
<rect x="77" y="95" width="24" height="24" rx="0" fill="var(--dvz-blue, #1766a4)" stroke="var(--dvz-blue, #1766a4)"/>
<circle cx="240" cy="107" r="7" fill="var(--dvz-orange, #985511)" stroke="none"/>
<line x1="228" y1="85" x2="103" y2="85" stroke="var(--dvz-orange, #985511)" stroke-width="1.5"/>
<polygon points="103,85 110.204,81.5203 110.204,88.4797" fill="var(--dvz-orange, #985511)" stroke="none" fill-opacity="1"/>
<text x="89" y="143" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">cube center</text>
<text x="240" y="143" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">camera</text>
<text x="89" y="165" font-size="14" fill="var(--md-default-fg-color--light, #586579)" text-anchor="middle">origin</text>
<text x="240" y="165" font-size="14" fill="var(--md-default-fg-color--light, #586579)" text-anchor="middle">camera position</text>
<text x="20" y="192" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="start" font-weight="600">View coordinates</text>
<line x1="48" y1="237" x2="278" y2="237" stroke="var(--md-default-fg-color--lighter, #8593a6)" stroke-width="1.5"/>
<rect x="77" y="225" width="24" height="24" rx="0" fill="var(--dvz-blue, #1766a4)" stroke="var(--dvz-blue, #1766a4)"/>
<circle cx="240" cy="237" r="7" fill="var(--dvz-orange, #985511)" stroke="none"/>
<line x1="228" y1="215" x2="103" y2="215" stroke="var(--dvz-orange, #985511)" stroke-width="1.5"/>
<polygon points="103,215 110.204,211.52 110.204,218.48" fill="var(--dvz-orange, #985511)" stroke="none" fill-opacity="1"/>
<text x="89" y="273" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">cube center</text>
<text x="240" y="273" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">camera</text>
<text x="89" y="295" font-size="14" fill="var(--md-default-fg-color--light, #586579)" text-anchor="middle">in front</text>
<text x="240" y="295" font-size="14" fill="var(--md-default-fg-color--light, #586579)" text-anchor="middle">origin</text>
</g>
</svg>

<title id="repeat-addressing-title">Repeat addressing wraps texture coordinates</title>
<desc id="repeat-addressing-desc">Two adjacent UV unit squares show the same eight-by-eight tile pattern from the chapter’s 64-by-64 texture. Each has the white orientation tile in its upper-left corner. Samples at UV (0.30,0.30) and (1.30,0.30) both read blue texel column 19, row 19. u increases right and v down.</desc>

<svg xmlns="http://www.w3.org/2000/svg" class="dvz-schematic" viewBox="0 0 320 365" role="img" aria-labelledby="nearest-texel-title nearest-texel-desc">
<title id="nearest-texel-title">Nearest filtering chooses one texel</title>
<desc id="nearest-texel-desc">A magnified four-by-four region of the chapter’s 64-by-64 texture. Columns and rows run from 6 through 9. A sample at texel coordinates (7.75,7.25), or UV (7.75/64,7.25/64), selects column 7, row 7. The cross is the sample position and the circle is the selected texel center. Nearest filtering does not blend adjacent texels.</desc>
<g font-family="system-ui, sans-serif" font-size="14">
<rect x="0" y="0" width="320" height="365" rx="4" fill="var(--md-code-bg-color, #f5f7fa)" stroke="none"/>
<text x="16" y="26" font-size="17" fill="var(--md-default-fg-color, #253247)" text-anchor="start" font-weight="600">Nearest: one texel, no blend</text>
<text x="152" y="51" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">column →</text>
<text x="16" y="73" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="start">row</text>
<rect x="64" y="84" width="44" height="44" rx="0" fill="#f5f5f5" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="108" y="84" width="44" height="44" rx="0" fill="#f5f5f5" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="152" y="84" width="44" height="44" rx="0" fill="#ebaa37" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="196" y="84" width="44" height="44" rx="0" fill="#ebaa37" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<text x="43" y="111" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="end">6</text>
<text x="86" y="73" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">6</text>
<rect x="64" y="128" width="44" height="44" rx="0" fill="#f5f5f5" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="108" y="128" width="44" height="44" rx="0" fill="#f5f5f5" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="152" y="128" width="44" height="44" rx="0" fill="#ebaa37" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="196" y="128" width="44" height="44" rx="0" fill="#ebaa37" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<text x="43" y="155" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="end">7</text>
<text x="130" y="73" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">7</text>
<rect x="64" y="172" width="44" height="44" rx="0" fill="#ebaa37" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="108" y="172" width="44" height="44" rx="0" fill="#ebaa37" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="152" y="172" width="44" height="44" rx="0" fill="#2350be" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="196" y="172" width="44" height="44" rx="0" fill="#2350be" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<text x="43" y="199" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="end">8</text>
<text x="174" y="73" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">8</text>
<rect x="64" y="216" width="44" height="44" rx="0" fill="#ebaa37" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="108" y="216" width="44" height="44" rx="0" fill="#ebaa37" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="152" y="216" width="44" height="44" rx="0" fill="#2350be" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<rect x="196" y="216" width="44" height="44" rx="0" fill="#2350be" stroke="var(--md-code-bg-color, #f5f7fa)"/>
<text x="43" y="243" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="end">9</text>
<text x="218" y="73" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">9</text>
<rect x="109" y="129" width="42" height="42" rx="0" fill="none" stroke="#101820"/>
<line x1="130" y1="150" x2="141" y2="139" stroke="#182333" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="130" cy="150" r="4" fill="none" stroke="#182333"/>
<line x1="136" y1="134" x2="146" y2="144" stroke="#a51c30" stroke-width="2.5"/>
<line x1="136" y1="144" x2="146" y2="134" stroke="#a51c30" stroke-width="2.5"/>
<text x="16" y="291" font-size="14" fill="var(--dvz-red, #a63e4a)" text-anchor="start" font-weight="600">× sample</text>
<text x="134" y="291" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="start">○ chosen center</text>
<text x="16" y="320" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="start">UV = (7.75/64, 7.25/64)</text>
<text x="16" y="344" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="start">Selected texel: column 7, row 7</text>
</g>
</svg>

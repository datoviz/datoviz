<svg xmlns="http://www.w3.org/2000/svg" class="dvz-schematic" viewBox="0 0 320 350" role="img" aria-labelledby="light-positions-title light-positions-desc">
<title id="light-positions-title">Light, eye and an illustrative surface point in view space</title>
<desc id="light-positions-desc">A plane through view-space P=(0,0,-3), eye E=(0,0,0), and light L=(2,2,0). Horizontal s=(x+y)/sqrt(2) and vertical positive z. Dashed guides from P point toward the eye and light. These guides show positions and distances, not unit-vector lengths.</desc>
<g font-family="system-ui, sans-serif" font-size="14">
<rect x="0" y="0" width="320" height="350" rx="4" fill="var(--md-code-bg-color, #f5f7fa)" stroke="none"/>
<text x="16" y="26" font-size="17" fill="var(--md-default-fg-color, #253247)" text-anchor="start" font-weight="600">Positions in view space</text>
<line x1="100" y1="250" x2="100" y2="80" stroke="var(--dvz-green, #23745a)" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="100" y1="250" x2="260" y2="80" stroke="var(--dvz-orange, #985511)" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="70" y1="250" x2="130" y2="250" stroke="var(--md-default-fg-color, #253247)" stroke-width="4"/>
<circle cx="100" cy="250" r="4" fill="var(--md-default-fg-color, #253247)" stroke="none"/>
<circle cx="100" cy="80" r="5" fill="var(--dvz-green, #23745a)" stroke="none"/>
<circle cx="260" cy="80" r="5" fill="var(--dvz-orange, #985511)" stroke="none"/>
<text x="100" y="58" font-size="14" fill="var(--dvz-green, #23745a)" text-anchor="middle" font-weight="600">Eye E</text>
<text x="100" y="105" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">(0, 0, 0)</text>
<text x="260" y="58" font-size="14" fill="var(--dvz-orange, #985511)" text-anchor="middle" font-weight="600">Light L</text>
<text x="260" y="105" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">(2, 2, 0)</text>
<text x="100" y="277" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">P = (0, 0, −3)</text>
<line x1="35" y1="230" x2="35" y2="136" stroke="var(--md-default-fg-color--lighter, #8593a6)" stroke-width="2"/>
<polygon points="35,136 38.4797,143.204 31.5203,143.204" fill="var(--md-default-fg-color--lighter, #8593a6)" stroke="none" fill-opacity="1"/>
<text x="35" y="126" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">+z</text>
<line x1="180" y1="250" x2="296" y2="250" stroke="var(--md-default-fg-color--lighter, #8593a6)" stroke-width="2"/>
<polygon points="296,250 288.796,253.48 288.796,246.52" fill="var(--md-default-fg-color--lighter, #8593a6)" stroke="none" fill-opacity="1"/>
<text x="296" y="275" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="end">+s</text>
<text x="160" y="311" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">s = (x + y) / √2</text>
<text x="160" y="336" font-size="14" fill="var(--md-default-fg-color, #253247)" text-anchor="middle">Illustrative point, not a cube snapshot</text>
</g>
</svg>

<title id="lighting-ambient-title">Ambient only on an illustrative sphere</title>
<desc id="lighting-ambient-desc">A mathematical illustration, not a capture of the course cube. The sphere has radius 0.9, center (0,0,-3), constant linear albedo (0.55,0.28,0.12), and white tint. Eye (0,0,0), light (2,2,0), and the chapter’s coefficients 0.16, 0.84, 0.35 and exponent 32 are shared by all four panels. This panel shows the constant ambient contribution. All panels use the same exposure, clamping and linear-to-sRGB conversion.</desc>

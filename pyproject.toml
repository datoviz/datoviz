[build-system]
requires = [
    "setuptools",
    "wheel",
    "build",
    "tqdm",
    "libclang",
    "auditwheel; sys_platform == 'linux'",
    "delocate; sys_platform == 'darwin'",
    "delvewheel; sys_platform == 'win32'",
    "tomli; python_version < '3.11'",
]
build-backend = "datoviz_build_backend.backend"
backend-path = ["tools"]

[project]
name = "datoviz"
requires-python = ">=3.10"
dependencies = ["numpy", "requests", "platformdirs"]
version = "0.4.0.dev0"
description = "Datoviz: high-performance rendering for scientific data visualization"
authors = [
    { name = "Cyrille Rossant", email = "cyrille.rossant@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["visualization", "scientific visualization", "vulkan", "gpu", "datoviz"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[tool.setuptools]
packages = ["datoviz", "datoviz.experimental"]
package-data = {"datoviz" = [
    "lib*",
    "*.so",
    "*.dll",
    "*.dylib",
    "*.json",
    "include/*.h",
    "include/**/*.h",
    "lib/cmake/datoviz/*.cmake",
]}

[project.scripts]
datoviz-config = "datoviz.cli:main"

[project.optional-dependencies]
qt = ["PyQt6"]

[project.urls]
"Homepage" = "https://github.com/datoviz/datoviz"
"Documentation" = "https://github.com/datoviz/datoviz"
"Source" = "https://github.com/datoviz/datoviz"

[tool.datoviz.wheel]
platform-specific = true
native-build-dir = "build"
include-headers = true
include-cmake-package = true
runtime-dirs-env = "DVZ_WHEEL_RUNTIME_DIRS"
require-shaderc = true
payload-manifest = "datoviz/_wheel_payload.json"

[tool.datoviz.wheel.macos]
platform-tags = ["macosx_10_13_x86_64", "macosx_11_0_arm64"]
repair-tool = "delocate"
runtime-patterns = [
    "libshaderc*.dylib",
    "libvulkan*.dylib",
    "libMoltenVK.dylib",
    "MoltenVK_icd.json",
]

[tool.datoviz.wheel.linux]
platform-tags = ["manylinux_2_34_x86_64", "manylinux_2_34_aarch64"]
repair-tool = "auditwheel"
runtime-patterns = ["libshaderc*.so*"]

[tool.datoviz.wheel.windows]
platform-tags = ["win_amd64", "win_arm64"]
repair-tool = "delvewheel"
runtime-patterns = ["*.dll"]

[tool.ruff]
format.quote-style = "single"
exclude = [
    "datoviz/_ctypes.py",
    "datoviz/_array_facade.py",
    "datoviz/backends/*.py",
]
line-length = 99
lint.select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle (docstring checks)
    "UP",   # pyupgrade (modernize Python syntax)
    "B",    # flake8-bugbear (best practices)
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit (security)
]
lint.extend-select = [
    "C4",
    "LOG",
    "G",
    "PIE",
    "TID",
    "FLY",
    "E",
    "W",
    "PGH",
    "PLE",
    "UP",
]
lint.ignore = [
    "C408",
    "D200",
    "D203",
    "D205",
    "D212",
    "D400",
    "D413",
    "D415",
    "N802",
    "N806",
    "N813",
    "N816",
    "S101",
    "PGH004",
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["D103"]


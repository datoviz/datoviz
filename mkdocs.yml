site_name: Datoviz v0.4 Documentation
site_url: https://datoviz.org
repo_url: https://github.com/datoviz/datoviz
docs_dir: docs
watch:
  - build/vulkan-course-media
  - build-wasm-scene/wasm
  - examples/webgpu
  - web/drp2
  - web/wasm
site_description: 'Datoviz v0.4: C-first GPU rendering engine for scientific visualization'
site_author: Cyrille Rossant
exclude_docs: |
  README.md
  assets~/*
  architecture/*
  discussions/*
  gallery/*
  guide/*
  tasks/*
  visuals/*
theme:
  name: material
  custom_dir: overrides
  logo: images/logow.png
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.path
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
extra_css:
  - stylesheets/extra.css
  - stylesheets/content.css
  - stylesheets/landing.css
extra_javascript:
  - javascripts/gallery-media.js
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  - search
  - material/blog:
      authors: false
      draft_if_future_date: true
      draft_on_serve: true
      post_url_format: "{slug}"
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: table
            docstring_style: numpy
            filters: ["!^_"]
            inherited_members: true
            merge_init_into_class: true
            parameter_headings: false
            separate_signature: true
            show_docstring_attributes: false
            show_docstring_modules: false
            show_object_full_path: false
            show_root_heading: true
            show_root_members_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: false
            heading_level: 2
hooks:
  - tools/mkdocs_hooks.py

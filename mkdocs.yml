site_name: Datoviz v0.4 Documentation
site_url: https://datoviz.org
repo_url: https://github.com/datoviz/datoviz
docs_dir: docs
site_description: 'Datoviz v0.4: C-first GPU rendering engine for scientific visualization'
site_author: Cyrille Rossant
exclude_docs: |
  README.md
  quickstart.md
  architecture/*
  blog/*
  discussions/*
  gallery/*
  guide/*
  tasks/*
  visuals/*
  reference/api_c.md
  reference/api_py.md
  reference/colormaps.md
theme:
  name: material
  logo: images/logow.png
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: table
            docstring_style: numpy
            filters: ["!^_"]
            inherited_members: true
            merge_init_into_class: true
            parameter_headings: false
            separate_signature: true
            show_docstring_attributes: false
            show_docstring_modules: false
            show_object_full_path: false
            show_root_heading: true
            show_root_members_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
hooks:
  - tools/mkdocs_hooks.py

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datoviz DRP2 WebGPU Triangle</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #111318;
      color: #f1f3f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #111318;
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 48px;
      padding: 10px 18px;
      border-color: #2a2f3a;
      color: #cbd1dc;
      font-size: 13px;
    }

    header {
      border-bottom: 1px solid #2a2f3a;
    }

    footer {
      border-top: 1px solid #2a2f3a;
    }

    main {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    canvas {
      width: min(80vw, 720px);
      height: min(80vh, 720px);
      max-width: calc(100vw - 48px);
      max-height: calc(100vh - 144px);
      aspect-ratio: 1;
      background: #05070b;
      border: 1px solid #2d3442;
      display: block;
    }

    code {
      color: #9ec5ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
        monospace;
      font-size: 12px;
    }

    #status {
      color: #f3d48b;
      text-align: right;
    }
  </style>
</head>
<body>
  <header>
    <strong>DRP2 WebGPU</strong>
    <code id="stream-name">streams/triangle_vertex_buffer_wgsl.json</code>
  </header>
  <main>
    <canvas id="viewport" aria-label="DRP2 WebGPU output"></canvas>
  </main>
  <footer>
    <span>Datoviz experimental WebGPU PoC</span>
    <span id="status">Starting</span>
  </footer>
  <script type="module" src="./drp2_webgpu.js"></script>
</body>
</html>

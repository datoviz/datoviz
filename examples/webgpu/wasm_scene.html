<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Datoviz WASM Scene</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101318;
        color: #eef1f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: #101318;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 48px;
        padding: 10px 16px;
        border-color: #2e3540;
        color: #c7cdd4;
        font-size: 13px;
      }

      header {
        border-bottom: 1px solid #2e3540;
      }

      footer {
        border-top: 1px solid #2e3540;
      }

      h1 {
        margin: 0;
        color: #f4f7fa;
        font-size: 15px;
        font-weight: 650;
      }

      #status {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: right;
      }

      #viewport {
        width: 100%;
        height: 100%;
        display: block;
        background: #05070a;
        touch-action: none;
        cursor: crosshair;
      }

      .error {
        color: #ff8d7d;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Datoviz WASM Scene</h1>
      <div id="status">Starting</div>
    </header>
    <canvas id="viewport"></canvas>
    <footer>
      <span>scene -> WASM -> DRP2 -> WebGPU</span>
      <span id="stats"></span>
    </footer>
    <script type="module" src="./wasm_scene_demo.js"></script>
  </body>
</html>

version: 2
status: v04_example_tree_reset
source_of_truth:
  planning: ../../spec/scene/examples/PLANNING.md
  execution: ../../spec/scene/examples/EXECUTION.md
  style: ../../spec/scene/examples/STYLE.md

taxonomy:
  target_public_categories:
    visuals: one public visual family per example
    features: one isolated scene feature or rendering technique per example
    runtime: app lifecycle, native windowing, offscreen capture, recording, and export examples
    composites: one semantic object that lowers to one or more visuals per example
    showcases: composed workflows, scientific stories, real-data examples, and polished demos
    advanced: low-level runtime, DRP2, and host-integration examples
  schema:
    category: visual | feature | runtime | composite | showcase | advanced
    primary_visual: required for visual examples
    primary_feature: required for feature examples
    primary_runtime: required for runtime examples
    primary_composite: required for composite examples
    source_language: optional fenced-code language for the primary source
    extra_sources: optional additional code tabs with label, language, and path
    python.source: optional Python source tab path
    python.status: generated | generated-with-hints | manual | deferred
    tags: searchable labels for docs, agents, and gallery filters
    data.kind: synthetic | simulated | generated | real | prepared
    capture.mode: scenario by default; custom requires capture.reason
    capture.size: optional WxH override; defaults to defaults.public_capture
    portability: portable-scenario | native-only | browser-only
    webgpu.status: webgpu-live | webgpu-planned | webgpu-deferred | native-only | browser-only
    webgpu.route: live browser route for webgpu-live examples
    webgpu.scenario_id: compiled C/WASM scenario id when it differs from the public route id
    webgpu.requirements: browser capability tags used by website routing and diagnostics
    agent_copy_safe: true only for examples suitable as starting points for generated user code
  tag_not_folder:
    - workflow
    - scientific
    - technique
    - real-data
    - simulated
    - fake-data
    - interactive
    - offscreen

folders:
  public:
    - examples/c/start
    - examples/c/features
    - examples/c/runtime
    - examples/c/visuals
    - examples/c/composites
    - examples/c/showcases
    - examples/c/advanced
    - examples/qt
    - examples/python/qt
  non_public:
    - examples/c/lab
    - examples/c/legacy

defaults:
  palette: graphite_cyan
  public_capture: 1280x720
  seed: 12345


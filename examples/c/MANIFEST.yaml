version: 2
status: v04_example_tree_reset
source_of_truth:
  planning: ../../spec/scene/examples/PLANNING.md
  execution: ../../spec/scene/examples/EXECUTION.md
  style: ../../spec/scene/examples/STYLE.md

folders:
  public:
    - examples/c/features
    - examples/c/visuals
    - examples/c/composites
    - examples/c/workflows
    - examples/c/showcases
    - examples/c/scientific
  non_public:
    - examples/c/lab
    - examples/c/legacy

defaults:
  palette: graphite_cyan
  public_capture: 1600x1200
  seed: 12345

examples:
  - id: path_axes_2d
    title: Path With 2D Axes
    stage: v0.4_required
    lane: features
    source: examples/c/features/axes_2d.c
    validation: smoke+screenshot

  - id: linked_panels_axes_panzoom
    title: Linked Panels With Axes
    stage: v0.4_required
    lane: workflows
    source: examples/c/workflows/panel_linked_axes.c
    validation: smoke+interaction

  - id: scale_bar
    title: Scale Bar
    stage: v0.4_required
    lane: features
    source: examples/c/features/scalebar.c
    validation: smoke+screenshot

  - id: scalebar_measurement_workflow
    title: Scale Bar Measurement Workflow
    stage: v0.4_required
    lane: workflows
    source: examples/c/workflows/scalebar_measurement.c
    validation: smoke+screenshot

  - id: colorbar
    title: Colorbar
    stage: v0.4_required
    lane: features
    source: examples/c/features/colorbar.c
    validation: smoke+screenshot

  - id: annotation_readout
    title: Annotation Readout
    stage: v0.4_required
    lane: features
    source: examples/c/features/annotation_readout.c
    validation: smoke+screenshot

  - id: image_probe
    title: Image Probe
    stage: v0.4_required
    lane: features
    source: examples/c/features/image_probe.c
    validation: smoke+readback+screenshot

  - id: marker_picking
    title: Marker Picking
    stage: v0.4_required
    lane: features
    source: examples/c/features/pick_marker.c
    validation: smoke+interaction

  - id: visual_volume
    title: Volume
    stage: v0.4_required
    lane: visuals
    source: examples/c/visuals/volume.c
    validation: smoke+screenshot
    gallery:
      card: small
      status_label: supported
    features:
      - sampled-field
      - volume
      - transfer-function
      - boundary-box
      - arcball
      - capture

  - id: composite_polygon
    title: Polygon Composite
    stage: v0.4_required
    lane: composites
    source: examples/c/composites/polygon.c
    validation: smoke+screenshot
    gallery:
      card: small
      status_label: supported
    features:
      - composite
      - polygon
      - polygon-set
      - holes
      - panzoom

  - id: composite_graph_static
    title: Graph Composite
    stage: v0.4_required
    lane: composites
    source: examples/c/composites/graph.c
    validation: smoke+screenshot
    gallery:
      card: small
      status_label: supported
    features:
      - composite
      - graph
      - marker-nodes
      - bezier-edges
      - panzoom

  - id: protein_arcball_viewer
    title: Protein
    stage: v0.4_required
    lane: scientific
    source: examples/c/scientific/protein.c
    validation: smoke+screenshot+manual
    dataset:
      name: RCSB PDB protein structure
      source: https://files.rcsb.org/download/{pdb_id}.pdb
      license: RCSB PDB data usage policy applies.
      default_pdb_id: 6M0J
      fallback_pdb_id: 1UBQ
      fallback_prepared_path: data/examples/proteins/1ubq/prepared
      preprocessing: python tools/data/prepare_protein_arcball.py 1UBQ --regenerate
    encoding:
      position: atom coordinates normalized into scene space
      color: element-style atom colors from the preparation bundle
      size: atom radii scaled for sphere impostors
    gallery:
      card: section
      status_label: supported

  - id: showcase_wind_field
    title: Wind Field
    stage: v0.4_required
    lane: showcases
    source: examples/c/showcases/wind_field.c
    validation: smoke+screenshot
    gallery:
      card: section
      status_label: supported

  - id: showcase_gpu_particle_smoke
    title: GPU Particle Smoke
    stage: v0.4_required
    lane: showcases
    source: examples/c/showcases/gpu_particle_smoke.c
    validation: smoke+screenshot
    gallery:
      card: section
      status_label: experimental

  - id: showcase_textured_planet
    title: Textured Planets
    stage: v0.4_required
    lane: showcases
    source: examples/c/showcases/textured_planet.c
    validation: smoke+screenshot
    gallery:
      card: section
      status_label: supported
    features:
      - mesh
      - sampled-field
      - texture
      - arcball
      - capture

  - id: lab_axis_lattice_smoke
    title: Axis Lattice Smoke
    stage: lab
    lane: lab
    source: examples/c/lab/axis_lattice_smoke.c
    validation: smoke

  - id: lab_point_stress
    title: Point Stress
    stage: lab
    lane: lab
    source: examples/c/lab/point_stress.c
    validation: manual+performance

  - id: lab_protein_viewer
    title: Protein Viewer Workbench
    stage: lab
    lane: lab
    source: examples/c/lab/protein_viewer.c
    validation: manual

  - id: lab_record_dvzr
    title: DVZR Recorder
    stage: lab
    lane: lab
    source: examples/c/lab/record_dvzr.c
    validation: manual

  - id: lab_replay_dvzr
    title: DVZR Replay
    stage: lab
    lane: lab
    source: examples/c/lab/replay_dvzr.c
    validation: manual

  - id: lab_scalebar_2d_3d
    title: Scale Bar 2D/3D Lab
    stage: lab
    lane: lab
    source: examples/c/lab/scalebar_2d_3d.c
    validation: manual

  - id: lab_text_msdf_diagnostics
    title: Text MSDF Diagnostics
    stage: lab
    lane: lab
    source: examples/c/lab/text_msdf_diagnostics.c
    validation: manual

  - id: lab_text_msdf_lab
    title: Text MSDF Lab
    stage: lab
    lane: lab
    source: examples/c/lab/text_msdf_lab.c
    validation: manual

skipped_functions:
  reason: >
    Current generator output excludes functions whose signatures still require by-value records,
    unions, or other layouts that are intentionally not emitted until their ABI policy is explicit.
    Keep this list synchronized with datoviz._ctypes._SKIPPED_FUNCTIONS.
  dispositions:
    dvz_attachment_clear:
      disposition: intentional-skip
      reason: >
        Low-level vklite rendering helper taking VkClearValue by value. This is Vulkan-shaped
        runtime plumbing, not a raw Python user workflow.
    dvz_cmd_rendering_default:
      disposition: intentional-skip
      reason: >
        Low-level command-buffer helper combining borrowed Vulkan handles and VkClearValue by
        value. Python should use scene, app, canvas, or explicit vklite helpers instead.
    dvz_cmd_set_viewport_scissor:
      disposition: intentional-skip
      reason: >
        Low-level dynamic-state convenience helper taking VkExtent2D by value. Raw Python callers
        may use the emitted pointer-based viewport and scissor functions when this advanced Vulkan
        workflow is required.
    dvz_depth_cue_desc:
      disposition: emit
      reason: >
        User-facing descriptor default is useful for direct Python examples. The full
        DvzDepthCueDesc ABI layout is generated, so the by-value default helper is safe to emit.
    dvz_material_desc:
      disposition: emit
      reason: >
        User-facing material descriptor default is safe to return by value now that
        DvzMaterialDesc and its nested material records are generated ctypes layouts.
    dvz_phong_material_desc:
      disposition: emit
      reason: >
        User-facing Phong material descriptor default is safe to return by value now that
        DvzMaterialDesc and its nested material records are generated ctypes layouts.
    dvz_polygon_desc:
      disposition: emit
      reason: >
        User-facing polygon descriptor default is safe to return by value now that DvzPolygonRing
        and DvzPolygonDesc layouts are generated.
    dvz_scale_bar_desc:
      disposition: emit
      reason: >
        User-facing scale-bar descriptor default is safe to return by value now that
        DvzScaleBarDesc is a generated ctypes layout.
    dvz_standard_material_desc:
      disposition: emit
      reason: >
        User-facing standard material descriptor default is safe to return by value now that
        DvzMaterialDesc and its nested material records are generated ctypes layouts.
    dvz_limb_material_desc:
      disposition: emit
      reason: >
        User-facing limb material descriptor default is safe to return by value now that
        DvzMaterialDesc and its nested material records are generated ctypes layouts.
    dvz_surface_capabilities:
      disposition: intentional-skip
      reason: >
        Returns VkSurfaceCapabilitiesKHR by value. This is low-level swapchain capability plumbing
        with Vulkan layout details, not a default raw Python workflow.
    dvz_surface_extent:
      disposition: intentional-skip
      reason: >
        Returns VkExtent2D by value from the low-level surface cache. Prefer scalar or higher-level
        view/window APIs for Python-facing size information.
    dvz_surface_preferred_format:
      disposition: intentional-skip
      reason: >
        Returns VkSurfaceFormatKHR by value. This is Vulkan presentation setup and should not be
        promoted to raw Python without a concrete interop need.
    dvz_swapchain_extent:
      disposition: intentional-skip
      reason: >
        Returns VkExtent2D by value from a low-level swapchain wrapper. Python-facing workflows
        should use view/window sizing APIs.
  expected:
    - dvz_attachment_clear
    - dvz_cmd_rendering_default
    - dvz_cmd_set_viewport_scissor
    - dvz_surface_capabilities
    - dvz_surface_extent
    - dvz_surface_preferred_format
    - dvz_swapchain_extent

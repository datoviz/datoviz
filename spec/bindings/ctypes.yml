# Initial v0.4 raw ctypes binding policy.
#
# The extractor currently uses this list as design input rather than as a strict parser dependency:
# each public module aggregator is parsed as its own clang translation unit to avoid accidental
# cross-header conflicts while still covering top-level public headers.

headers:
  include:
    - datoviz/app.h
    - datoviz/canvas.h
    - datoviz/common.h
    - datoviz/drp2.h
    - datoviz/dvzmath.h
    - datoviz/fileio.h
    - datoviz/font.h
    - datoviz/ffi.h
    - datoviz/geom.h
    - datoviz/gui.h
    - datoviz/imgui.h
    - datoviz/input.h
    - datoviz/runner.h
    - datoviz/scene.h
    - datoviz/scene/frame_packets.h
    - datoviz/stream.h
    - datoviz/video.h
    - datoviz/vk.h
    - datoviz/vk/memory_interop.h
    - datoviz/vklite.h
    - datoviz/window.h

smoke_symbols:
  - dvz_time_monotonic_ns
  - dvz_scene
  - dvz_scene_id
  - dvz_figure_id
  - dvz_panel_id
  - dvz_visual_id
  - dvz_sampled_field_id
  - dvz_scale_id
  - dvz_colormap_id
  - dvz_colorbar_id
  - dvz_legend_id
  - dvz_text_id
  - dvz_annotation_id
  - dvz_controller_id
  - dvz_scene_destroy
  - dvz_figure
  - dvz_panel_full
  - dvz_capability_snapshot
  - dvz_view_capabilities
  - dvz_query_request
  - dvz_panel_query
  - dvz_panel_query_data
  - dvz_panel_transform_point
  - dvz_panel_position_to_data
  - dvz_panel_data_to_position
  - dvz_figure_process_queries
  - dvz_scene_poll_query
  - dvz_ffi_view_external_surface
  - dvz_ffi_view_update_external_surface
  - dvz_interop_buffer_export_from_buffer
  - dvz_interop_buffer_wait_timeline
  - dvz_interop_gpu_ctx

layout_records:
  include:
    - DvzCapabilitySnapshot
    - DvzCanvasConfig
    - DvzFieldDataView
    - DvzFieldRegion
    - DvzInteropBufferExport
    - DvzInteropBufferExportConfig
    - DvzPointerWheelEvent
    - DvzPointerDragEvent
    - DvzPointerEventUnion
    - DvzPointerEvent
    - DvzQueryRequest
    - DvzQueryResult
    - DvzSampledFieldDesc
    - DvzStreamConfig
    - DvzAxisTickPolicy
    - DvzAxisTicks
    - DvzAxisStyle
    - DvzTextItem
    - DvzTextLayout
    - DvzTextPlacement
    - DvzTextStyle
    - DvzVideoEncoderConfig

callback_functions:
  subscription:
    - dvz_anim_timer
    - dvz_input_subscribe_event
    - dvz_input_subscribe_keyboard
    - dvz_input_subscribe_pointer
    - dvz_input_subscribe_resize
    - dvz_input_subscribe_scale
    - dvz_view_post
  unsubscribe:
    - dvz_input_unsubscribe_event
    - dvz_input_unsubscribe_keyboard
    - dvz_input_unsubscribe_pointer
    - dvz_input_unsubscribe_resize
    - dvz_input_unsubscribe_scale
  setter:
    - dvz_canvas_set_draw_callback
    - dvz_view_set_frame_callback
    - dvz_view_set_gui_callback
    - dvz_view_set_request_frame_callback
  global:
    - dvz_error_callback

owned_string_returns:
  dvz_drp2_stream_json:
    destroy: dvz_drp2_stream_json_destroy
  dvz_drp2_stream_json_payload_refs:
    destroy: dvz_drp2_stream_json_destroy
  dvz_frame_plan_json:
    destroy: dvz_frame_plan_json_destroy
  dvz_scene_frame_artifact_json:
    destroy: dvz_drp2_stream_json_destroy
  dvz_scene_json:
    destroy: dvz_scene_json_destroy

array_facade:
  dvz_scene_buffer_set_data:
    groups:
      - pointer_arg: data
        size_arg: byte_size
        size_from: nbytes
        lifetime: copied_before_return

  dvz_visual_set_data:
    strings:
      - attr_name
    groups:
      - pointer_arg: data
        count_arg: item_count
        count_from: shape0
        lifetime: copied_before_return

  dvz_visual_set_data_many:
    special: visual_data_updates

  dvz_axis_set_ticks:
    special: axis_ticks

  dvz_colorbar_set_ticks:
    special: colorbar_ticks

  dvz_text_set_items:
    groups:
      - pointer_arg: items
        count_arg: item_count
        count_from: shape0
        lifetime: copied_before_return

  dvz_text_set_positions:
    groups:
      - pointer_arg: positions
        count_arg: item_count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return

  dvz_text_set_offsets:
    groups:
      - pointer_arg: offsets
        count_arg: item_count
        count_from: shape0
        dtype: float32
        lifetime: copied_before_return

  dvz_text_set_anchors:
    groups:
      - pointer_arg: anchors
        count_arg: item_count
        count_from: shape0
        dtype: float32
        lifetime: copied_before_return

  dvz_text_set_sizes:
    groups:
      - pointer_arg: sizes_px
        count_arg: item_count
        count_from: shape0
        dtype: float32
        lifetime: copied_before_return

  dvz_text_set_colors:
    groups:
      - pointer_arg: colors
        count_arg: item_count
        count_from: shape0
        dtype: uint8
        lifetime: copied_before_return

  dvz_text_set_angles:
    groups:
      - pointer_arg: angles
        count_arg: item_count
        count_from: shape0
        dtype: float32
        lifetime: copied_before_return

  dvz_visual_set_data_range:
    strings:
      - attr_name
    groups:
      - pointer_arg: data
        count_arg: item_count
        count_from: shape0
        lifetime: copied_before_return

  dvz_visual_set_index_data:
    groups:
      - pointer_arg: indices
        count_arg: index_count
        count_from: shape0
        dtype: uint32
        lifetime: copied_before_return

skipped_functions:
  reason: >
    Current generator output excludes functions whose signatures still require by-value records,
    unions, or other layouts that are intentionally not emitted until their ABI policy is explicit.
    Keep this list synchronized with datoviz._ctypes._SKIPPED_FUNCTIONS.
  expected:
    - dvz_attachment_clear
    - dvz_camera_desc
    - dvz_camera_motion_desc
    - dvz_camera_view
    - dvz_cmd_rendering_default
    - dvz_depth_cue_desc
    - dvz_device_config
    - dvz_field_geometry
    - dvz_fly_desc
    - dvz_frame_plan_emit_config
    - dvz_geometry_arrow_desc
    - dvz_geometry_cone_desc
    - dvz_geometry_cube_desc
    - dvz_geometry_cylinder_desc
    - dvz_geometry_disc_desc
    - dvz_geometry_plane_desc
    - dvz_geometry_regular_polygon_desc
    - dvz_geometry_sector_desc
    - dvz_geometry_sphere_desc
    - dvz_geometry_star_desc
    - dvz_geometry_surface_grid_desc
    - dvz_geometry_torus_desc
    - dvz_gpu_ctx_config
    - dvz_material_desc
    - dvz_overlay_card_desc
    - dvz_overlay_card_style
    - dvz_panel_background_desc
    - dvz_phong_material_desc
    - dvz_polygon_desc
    - dvz_reference_grid_desc
    - dvz_scalebar_desc
    - dvz_standard_material_desc
    - dvz_surface_capabilities
    - dvz_surface_extent
    - dvz_surface_preferred_format
    - dvz_swapchain_extent
    - dvz_track_circle2_desc
    - dvz_track_circle3_desc
    - dvz_track_rotation_desc
    - dvz_transform_motion_desc
    - dvz_turntable_desc
    - dvz_visual_transform_desc
    - dvz_window_external_surface_info

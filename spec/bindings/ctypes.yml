# Initial v0.4 raw ctypes binding policy.
#
# The extractor currently uses this list as design input rather than as a strict parser dependency:
# each public module aggregator is parsed as its own clang translation unit to avoid accidental
# cross-header conflicts while still covering top-level public headers.

headers:
  include:
    - datoviz/app.h
    - datoviz/canvas.h
    - datoviz/common.h
    - datoviz/drp2.h
    - datoviz/ds.h
    - datoviz/dvzmath.h
    - datoviz/fileio.h
    - datoviz/font.h
    - datoviz/geom.h
    - datoviz/gui.h
    - datoviz/imgui.h
    - datoviz/input.h
    - datoviz/runner.h
    - datoviz/scene.h
    - datoviz/stream.h
    - datoviz/thread.h
    - datoviz/video.h
    - datoviz/vk.h
    - datoviz/vk/memory_interop.h
    - datoviz/vklite.h
    - datoviz/window.h

smoke_symbols:
  - dvz_time_monotonic_ns
  - dvz_scene
  - dvz_scene_destroy
  - dvz_view_external_surface_ffi
  - dvz_view_update_external_surface_ffi
  - dvz_interop_buffer_export_from_buffer
  - dvz_interop_buffer_wait_timeline
  - dvz_interop_gpu_ctx

layout_records:
  include:
    - DvzCanvasConfig
    - DvzCameraDesc
    - DvzFlyDesc
    - DvzInteropBufferExport
    - DvzInteropBufferExportConfig
    - DvzPointerWheelEvent
    - DvzPointerDragEvent
    - DvzPointerEventUnion
    - DvzPointerEvent
    - DvzStreamConfig
    - DvzTurntableDesc
    - DvzVideoEncoderConfig

callback_functions:
  subscription:
    - dvz_anim_timer
    - dvz_deq_callback
    - dvz_input_subscribe_event
    - dvz_input_subscribe_keyboard
    - dvz_input_subscribe_pointer
    - dvz_input_subscribe_resize
    - dvz_input_subscribe_scale
    - dvz_view_post
  unsubscribe:
    - dvz_input_unsubscribe_event
    - dvz_input_unsubscribe_keyboard
    - dvz_input_unsubscribe_pointer
    - dvz_input_unsubscribe_resize
    - dvz_input_unsubscribe_scale
  setter:
    - dvz_canvas_set_draw_callback
    - dvz_view_set_frame_callback
    - dvz_view_set_gui_callback
    - dvz_view_set_request_frame_callback
  global:
    - dvz_error_callback
    - dvz_thread

skipped_functions:
  reason: >
    Current generator output excludes functions whose signatures still require by-value records,
    unions, or other layouts that are intentionally not emitted until their ABI policy is explicit.
    Keep this list synchronized with datoviz._ctypes._SKIPPED_FUNCTIONS.
  expected:
    - dvz_attachment_clear
    - dvz_cmd_rendering_default
    - dvz_cond
    - dvz_deq_dequeue_return
    - dvz_deq_peek_first
    - dvz_deq_peek_last
    - dvz_device_config
    - dvz_frame_plan_emit_config
    - dvz_gpu_ctx_config
    - dvz_material_desc
    - dvz_mutex
    - dvz_orbit_camera_desc
    - dvz_overlay_card_style
    - dvz_panel_background_desc
    - dvz_panel_border_desc
    - dvz_phong_material_desc
    - dvz_standard_material_desc
    - dvz_surface_capabilities
    - dvz_surface_extent
    - dvz_surface_preferred_format
    - dvz_swapchain_extent

owned_string_returns:
  dvz_read_gz:
    destroy: dvz_memory_free
  dvz_drp2_stream_json:
    destroy: dvz_drp2_stream_json_destroy
  dvz_drp2_stream_json_payload_refs:
    destroy: dvz_drp2_stream_json_destroy
  dvz_frame_plan_json:
    destroy: dvz_frame_plan_json_destroy
  dvz_scene_frame_artifact_json:
    destroy: dvz_drp2_stream_json_destroy
  dvz_scene_json:
    destroy: dvz_scene_json_destroy

array_facade:
  dvz_band_set_bounds:
    groups:
      - pointer_arg: x
        count_arg: count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return
      - pointer_arg: lower
        count_arg: count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return
      - pointer_arg: upper
        count_arg: count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return

  dvz_band_set_center:
    groups:
      - pointer_arg: x
        count_arg: count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return
      - pointer_arg: y
        count_arg: count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return

  dvz_bars_set_intervals:
    groups:
      - pointer_arg: starts
        count_arg: count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return
      - pointer_arg: ends
        count_arg: count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return
      - pointer_arg: values
        count_arg: count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return

  dvz_scene_buffer_set_data:
    groups:
      - pointer_arg: data
        size_arg: byte_size
        size_from: nbytes
        lifetime: copied_before_return

  dvz_visual_set_data:
    strings:
      - attr_name
    groups:
      - pointer_arg: data
        count_arg: item_count
        count_from: shape0
        lifetime: copied_before_return

  dvz_visual_set_data_many:
    special: visual_data_updates

  dvz_axis_set_ticks:
    special: axis_ticks

  dvz_colorbar_set_ticks:
    special: colorbar_ticks

  dvz_view_window:
    strings:
      - title

  dvz_text_set_items:
    groups:
      - pointer_arg: items
        count_arg: item_count
        count_from: shape0
        lifetime: copied_before_return

  dvz_text_set_positions:
    groups:
      - pointer_arg: positions
        count_arg: item_count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return

  dvz_text_set_offsets:
    groups:
      - pointer_arg: offsets
        count_arg: item_count
        count_from: shape0
        dtype: float32
        lifetime: copied_before_return

  dvz_text_set_anchors:
    groups:
      - pointer_arg: anchors
        count_arg: item_count
        count_from: shape0
        dtype: float32
        lifetime: copied_before_return

  dvz_text_set_sizes:
    groups:
      - pointer_arg: sizes_px
        count_arg: item_count
        count_from: shape0
        dtype: float32
        lifetime: copied_before_return

  dvz_text_set_colors:
    groups:
      - pointer_arg: colors
        count_arg: item_count
        count_from: shape0
        dtype: uint8
        lifetime: copied_before_return

  dvz_text_set_angles:
    groups:
      - pointer_arg: angles
        count_arg: item_count
        count_from: shape0
        dtype: float32
        lifetime: copied_before_return

  dvz_visual_set_data_range:
    strings:
      - attr_name
    groups:
      - pointer_arg: data
        count_arg: item_count
        count_from: shape0
        lifetime: copied_before_return

  dvz_visual_set_index_data:
    groups:
      - pointer_arg: indices
        count_arg: index_count
        count_from: shape0
        dtype: uint32
        lifetime: copied_before_return

skipped_functions:
  reason: >
    Current generator output excludes functions whose signatures still require by-value records,
    unions, or other layouts that are intentionally not emitted until their ABI policy is explicit.
    Keep this list synchronized with datoviz._ctypes._SKIPPED_FUNCTIONS.
  dispositions:
    dvz_attachment_clear:
      disposition: intentional-skip
      reason: >
        Low-level vklite rendering helper taking VkClearValue by value. This is Vulkan-shaped
        runtime plumbing, not a raw Python user workflow.
    dvz_cmd_rendering_default:
      disposition: intentional-skip
      reason: >
        Low-level command-buffer helper combining borrowed Vulkan handles and VkClearValue by
        value. Python should use scene, app, canvas, or explicit vklite helpers instead.
    dvz_depth_cue_desc:
      disposition: ffi-helper
      helper: dvz_ffi_depth_cue_desc
      reason: >
        User-facing descriptor default is useful, but the raw binding uses the pointer-output FFI
        helper to avoid by-value layout hazards.
    dvz_device_config:
      disposition: intentional-skip
      reason: >
        Device configuration contains Vulkan feature-chain state and is advanced runtime setup.
        Do not add a Python wrapper unless a concrete supported Python device-configuration
        workflow requires one.
    dvz_drp2_render_pass_desc:
      disposition: intentional-skip
      reason: >
        Advanced DRP2 descriptor default returns a record by value. Raw Python can construct the
        generated DvzDrp2RenderPassDesc layout directly when this low-level protocol path is needed.
    dvz_field_geometry:
      disposition: ffi-helper
      helper: dvz_ffi_field_geometry
      reason: >
        User-facing sampled-field geometry default is available through the pointer-output FFI
        helper.
    dvz_gpu_ctx_config:
      disposition: intentional-skip
      reason: >
        GPU-context configuration is low-level runtime/Vulkan setup. Keep skipped for raw Python
        unless a concrete supported workflow needs a safe opaque configuration API.
    dvz_material_desc:
      disposition: ffi-helper
      helper: dvz_ffi_material_desc
      reason: >
        User-facing material descriptor default is available through the pointer-output FFI helper.
    dvz_phong_material_desc:
      disposition: ffi-helper
      helper: dvz_ffi_phong_material_desc
      reason: >
        User-facing Phong material descriptor default is available through the pointer-output FFI
        helper.
    dvz_polygon_desc:
      disposition: ffi-helper
      helper: dvz_ffi_polygon_desc
      reason: >
        User-facing polygon triangulation descriptor default is available through the pointer-output
        FFI helper.
    dvz_reference_grid_desc:
      disposition: ffi-helper
      helper: dvz_ffi_reference_grid_desc
      reason: >
        User-facing reference-grid descriptor default is available through the pointer-output FFI
        helper.
    dvz_scale_bar_desc:
      disposition: ffi-helper
      helper: dvz_ffi_scale_bar_desc
      reason: >
        User-facing scale-bar descriptor default is available through the pointer-output FFI helper.
    dvz_standard_material_desc:
      disposition: ffi-helper
      helper: dvz_ffi_standard_material_desc
      reason: >
        User-facing standard material descriptor default is available through the pointer-output FFI
        helper.
    dvz_surface_capabilities:
      disposition: intentional-skip
      reason: >
        Returns VkSurfaceCapabilitiesKHR by value. This is low-level swapchain capability plumbing
        with Vulkan layout details, not a default raw Python workflow.
    dvz_surface_extent:
      disposition: intentional-skip
      reason: >
        Returns VkExtent2D by value from the low-level surface cache. Prefer scalar or higher-level
        view/window APIs for Python-facing size information.
    dvz_surface_preferred_format:
      disposition: intentional-skip
      reason: >
        Returns VkSurfaceFormatKHR by value. This is Vulkan presentation setup and should not be
        promoted to raw Python without a concrete interop need.
    dvz_swapchain_extent:
      disposition: intentional-skip
      reason: >
        Returns VkExtent2D by value from a low-level swapchain wrapper. Python-facing workflows
        should use view/window sizing APIs.
    dvz_visual_transform_desc:
      disposition: ffi-helper
      helper: dvz_ffi_visual_transform_desc
      reason: >
        User-facing visual-transform descriptor default is available through the pointer-output FFI
        helper.
    dvz_window_external_surface_info:
      disposition: intentional-skip
      reason: >
        Native external-surface descriptor is backend plumbing. Raw Python already has scalar FFI
        helpers for the supported hosted-surface update path.
  expected:
    - dvz_attachment_clear
    - dvz_cmd_rendering_default
    - dvz_depth_cue_desc
    - dvz_device_config
    - dvz_drp2_render_pass_desc
    - dvz_field_geometry
    - dvz_gpu_ctx_config
    - dvz_material_desc
    - dvz_phong_material_desc
    - dvz_polygon_desc
    - dvz_reference_grid_desc
    - dvz_scale_bar_desc
    - dvz_standard_material_desc
    - dvz_surface_capabilities
    - dvz_surface_extent
    - dvz_surface_preferred_format
    - dvz_swapchain_extent
    - dvz_visual_transform_desc
    - dvz_window_external_surface_info

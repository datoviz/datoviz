  - dvz_visual_attr_info
  - dvz_visual_attr_supported
  - dvz_visual_validate
  - dvz_sampled_field_id
  - dvz_scale_id
  - dvz_scale_domain
  - dvz_scale_view_range
  - dvz_scale_category_count
  - dvz_scale_category
  - dvz_colormap_id
  - dvz_colorbar_id
  - dvz_legend_id
  - dvz_text_id
  - dvz_annotation_id
  - dvz_controller_id
  - dvz_scene_destroy
  - dvz_figure
  - dvz_figure_validate
  - dvz_panel_desc
  - dvz_panel_full
  - dvz_capability_snapshot
  - dvz_view_capabilities
  - dvz_view_resize_scaled_xy
  - dvz_query_request
  - dvz_panel_query_px
  - dvz_panel_query_data
  - dvz_panel_transform_point

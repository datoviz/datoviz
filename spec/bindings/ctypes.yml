    DvzPanzoomResolved: 16
    DvzVisualTransformDesc: 16

concrete_records:
  DvzGeometry:
    disposition: pointer-opaque
    provenance:
      - native-returned
      - native-owned-input
    reason: >
      Geometry storage is native-owned. Python may pass only pointers returned by geometry APIs
      back to geometry consumers and destroyers; the zero-sized declaration is not allocatable.
  DvzTessellatedPath:
    disposition: pointer-opaque
    provenance:
      - native-returned
      - native-owned-input
    reason: >
      Tessellators return native-owned paths that Python may pass only to the matching destroyer.
  DvzTextAtlasGlyph:
    disposition: pointer-opaque
    provenance:
      - native-returned
    reason: >
      Text atlas glyph lookup returns a borrowed const pointer and never accepts caller allocation.
  DvzVolumeState:
    disposition: pointer-opaque
    provenance:
      - native-returned
    reason: >
      Volume state inspection returns a borrowed const pointer and never accepts caller allocation.
  DvzWindowSurface:
    disposition: pointer-opaque
    provenance:
      - native-returned
    reason: >
      Window surface inspection returns borrowed pointers and never accepts caller allocation.
  DvzCanvasLiveImageFrame:
    disposition: pointer-opaque
    provenance:
      - callback-borrowed:DvzCanvasLiveImageCallback
    reason: >
      Live-image callbacks receive a borrowed payload valid only for the callback invocation.
  DvzBarriers:
    disposition: unsupported
    reason: >
      The record embeds Vulkan dependency and barrier records whose layouts are intentionally not
      mirrored by ctypes.
  DvzDeviceConfig:
    disposition: unsupported
    reason: >
      The record embeds Vulkan feature-chain state whose platform ABI is intentionally unsupported.
  DvzGpuCtxConfig:
    disposition: unsupported
    reason: >
      The record embeds Vulkan feature-chain state whose platform ABI is intentionally unsupported.
  DvzDrp2ColorAttachment:
    disposition: unsupported
    reason: >
      This low-level DRP2 attachment record is unavailable as part of the unsupported render-pass
      descriptor family.
  DvzDrp2RenderPassDesc:
    disposition: unsupported
    reason: >
      This low-level DRP2 descriptor depends on the unsupported color-attachment record.
  DvzStreamFrame:
    disposition: unsupported
    provenance:
      - callback-borrowed:DvzCanvasDraw
    reason: >
      Caller-supplied stream-frame APIs are unsafe without the Vulkan-shaped layout, while the
      canvas draw callback may retain its explicitly borrowed payload pointer.
  DvzWindowExternalSurfaceInfo:
    disposition: unsupported
    reason: >
      The native external-surface descriptor embeds platform and Vulkan surface state. Scalar FFI
      helpers remain the supported Python path.

callback_functions:
  subscription:
    - dvz_anim_timer
    - dvz_input_subscribe_event
    - dvz_input_subscribe_keyboard
    - dvz_input_subscribe_pointer
    - dvz_input_subscribe_resize
    - dvz_input_subscribe_scale
    - dvz_view_post
  setter:
    - dvz_canvas_set_draw_callback
    - dvz_view_set_frame_callback
    - dvz_view_set_gui_callback
    - dvz_view_set_request_frame_callback
  global:
    - dvz_error_set_callback

owned_string_returns:
  dvz_read_gz:
    destroy: dvz_memory_free
  dvz_drp2_stream_json:
    destroy: dvz_drp2_stream_json_destroy
  dvz_drp2_stream_json_payload_refs:

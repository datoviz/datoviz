        count_from: shape0
        dtype: float64
        lifetime: copied_before_return
      - pointer_arg: lower
        count_arg: count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return
      - pointer_arg: upper
        count_arg: count
        count_from: shape0
        dtype: float64
        lifetime: copied_before_return

  dvz_band_set_center:

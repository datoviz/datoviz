name: Documentation issue
description: Report stale, unclear, missing, or broken Datoviz documentation.
title: "[docs] "
labels: ["area:documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: "docs URL or repository path"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: What is wrong, missing, stale, or unclear?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected wording or behavior
      description: Optional suggested correction.
  - type: input
    id: datoviz-version
    attributes:
      label: Datoviz version or commit
      placeholder: "Release version, wheel filename, or git commit"

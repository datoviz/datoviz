name: "TEST"

on:
  workflow_dispatch:
  push:
    branches:
      - v0.4-dev
  pull_request:
    branches:
      - v0.4-dev

env:
  DVZ_LOG_LEVEL: 2

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Materialize submodule LFS assets
        shell: bash
        run: bash tools/materialize_lfs_assets.sh
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache cmake glslang-tools glslc libfreetype-dev libvulkan-dev \
            mesa-vulkan-drivers ninja-build vulkan-tools vulkan-validationlayers xorg-dev xvfb
          python -m pip install -U pip uv
          python -m pip install -r requirements-dev.txt
          command -v glslangValidator
          command -v glslc
      - name: Check generated documentation
        run: |
          just docs-check-generated
          just docs-build-check
      - name: Build
        run: just build
      - name: Test quickstart fixtures
        run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" just quickstart-check
      - name: Test
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1024x768x24 -extension MIT-SHM"
          just test

  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Materialize submodule LFS assets
        run: bash tools/materialize_lfs_assets.sh
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Dependencies
        run: |
          brew install \
            just ccache ninja glslang shaderc vulkan-headers vulkan-loader molten-vk \
            vulkan-validationlayers freetype tinyxml2
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          command -v glslangValidator
          command -v glslc
      - name: Build
        run: just build
      - name: Test
        run: just test

  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,C:/vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Materialize submodule LFS assets
        shell: bash
        run: bash tools/materialize_lfs_assets.sh
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Cache vcpkg dependencies
        uses: actions/cache@v6
        with:
          path: |
            C:/vcpkg-binary-cache
            build/vcpkg_installed
          key: windows-x64-test-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Dependencies
        shell: pwsh
        run: |
          choco install just ninja ccache -y
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          if (!(Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
          }
          New-Item -ItemType Directory -Force C:/vcpkg-binary-cache | Out-Null
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --triplet x64-windows `
            --x-install-root="$PWD/build/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve shader tools
        shell: pwsh
        run: |
          $validator = Get-ChildItem build/vcpkg_installed -Recurse -Filter glslangValidator.exe -File |
            Select-Object -First 1
          $glslc = Get-ChildItem build/vcpkg_installed -Recurse -Filter glslc.exe -File |
            Select-Object -First 1
          if (!$validator -or !$glslc) {
            throw "glslangValidator.exe or glslc.exe was not installed by vcpkg"
          }
          "DVZ_GLSLANG_VALIDATOR=$($validator.FullName.Replace('\', '/'))" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DVZ_GLSLC=$($glslc.FullName.Replace('\', '/'))" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $validator.FullName --version
          & $glslc.FullName --version
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -GNinja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed" `
            -DDVZ_ENABLE_SHADERC=ON `
            -DDVZ_MIMALLOC_SOURCE=OFF `
            -DDVZ_BUILD_EXAMPLES=OFF `
            -DDVZ_CANVAS_SHADER_GLSLANG_VALIDATOR="$env:DVZ_GLSLANG_VALIDATOR" `
            -DGLSLC="$env:DVZ_GLSLC"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

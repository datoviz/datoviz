name: "Physical evidence intake"
run-name: "Physical evidence · Wheels ${{ inputs.wheel_run_id || 'RC branch request' }} · ${{ inputs.machine_id || github.ref_name }}"

on:
  push:
    branches: [main]
    paths:
      - ".github/physical-evidence-request.json"
      - ".github/workflows/physical-evidence-intake.yml"
  workflow_dispatch:
    inputs:
      package_ref:
        description: "Immutable GHCR reference containing one evidence archive"
        required: true
        type: string
      wheel_run_id:
        description: "Exact Wheels workflow run ID"
        required: true
        type: string
      machine_id:
        description: "Physical machine evidence identity"
        required: true
        type: string
      version:
        description: "Release version contained in the wheel"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  request:
    name: "Resolve evidence request"
    runs-on: ubuntu-latest
    outputs:
      package_ref: ${{ steps.request.outputs.package_ref }}
      wheel_run_id: ${{ steps.request.outputs.wheel_run_id }}
      machine_id: ${{ steps.request.outputs.machine_id }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: request
        env:
          INPUT_PACKAGE_REF: ${{ inputs.package_ref }}
          INPUT_WHEEL_RUN_ID: ${{ inputs.wheel_run_id }}
          INPUT_MACHINE_ID: ${{ inputs.machine_id }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            jq -n \
              --arg package_ref "$INPUT_PACKAGE_REF" \
              --arg wheel_run_id "$INPUT_WHEEL_RUN_ID" \
              --arg machine_id "$INPUT_MACHINE_ID" \
              --arg version "$INPUT_VERSION" \
              '{package_ref: $package_ref, wheel_run_id: $wheel_run_id, machine_id: $machine_id, version: $version}' \
              > request.json
          else
            cp .github/physical-evidence-request.json request.json
          fi
          for key in package_ref wheel_run_id machine_id version; do
            value=$(jq -r --arg key "$key" '.[$key] // empty' request.json)
            test -n "$value"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

  verify:
    name: "Verify physical evidence"
    needs: request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oras-project/setup-oras@v2
      - name: Download submitted bundle
        env:
          GHCR_TOKEN: ${{ github.token }}
          PACKAGE_REF: ${{ needs.request.outputs.package_ref }}
        run: |
          echo "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          mkdir -p build/intake
          oras pull "$PACKAGE_REF" --output build/intake
      - name: Verify immutable identity and manual approval
        env:
          WHEEL_RUN_ID: ${{ needs.request.outputs.wheel_run_id }}
          MACHINE_ID: ${{ needs.request.outputs.machine_id }}
          RELEASE_VERSION: ${{ needs.request.outputs.version }}
        run: |
          archive=$(find build/intake -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          test "$(find build/intake -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          python tools/release_wheels/conformance.py verify-bundle \
            --archive "$archive" \
            --output-dir build/accepted \
            --wheel-run-id "$WHEEL_RUN_ID" \
            --machine-id "$MACHINE_ID" \
            --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: physical-evidence-${{ needs.request.outputs.wheel_run_id }}-${{ needs.request.outputs.machine_id }}
          path: build/accepted
          retention-days: 90

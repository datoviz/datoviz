name: "Wheels"

on:
  workflow_dispatch:

env:
  # Build once per platform; Datoviz is Python-ABI independent and the backend emits
  # py3-none-<platform> directly. Separate install-smoke jobs cover Python 3.10 through 3.14,
  # with 3.15 prerelease enabled only for nightly/prerelease checks.
  DVZ_CMAKE_ARGS: "-DDVZ_ENABLE_SHADERC=ON"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.matrix.outputs.json }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python tools/release_wheels/wheel_matrix.py --json > matrix.json
          echo "json=$(python -c 'import json; print(json.dumps(json.load(open("matrix.json"))))')" >> "$GITHUB_OUTPUT"

  linux:
    needs: matrix
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/pypa/manylinux_2_34_${{ matrix.arch }}:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            platform_tag: manylinux_2_34_x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            platform_tag: manylinux_2_34_aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build, inspect, and smoke-test manylinux wheel
        env:
          DVZ_CMAKE_ARGS: "-DDVZ_ENABLE_SHADERC=ON -DDVZ_BUILD_TESTING=OFF -DDVZ_BUILD_EXAMPLES=OFF"
        run: |
          bash tools/release_wheels/manylinux_build_inside.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
            platform_tag: macosx_10_13_x86_64
          - runner: macos-latest
            arch: arm64
            platform_tag: macosx_11_0_arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencies
        run: |
          brew install just ccache ninja jq glslang shaderc vulkan-headers vulkan-loader molten-vk freetype tinyxml2
          python -m pip install -U pip build delocate
          command -v glslangValidator
          command -v delocate-listdeps
      - name: Build native artifacts
        run: |
          just build
      - name: Build wheels
        run: |
          export DVZ_WHEEL_RUNTIME_DIRS="$(brew --prefix shaderc)/lib:$(brew --prefix vulkan-loader)/lib:$(brew --prefix molten-vk)/lib:$(brew --prefix molten-vk)/share/vulkan/icd.d"
          python -m pip wheel . --no-deps -w wheelhouse \
            -C datoviz.release-wheel=true \
            -C datoviz.platform-tag=${{ matrix.platform_tag }}
      - name: Inspect wheels
        run: |
          for whl in wheelhouse/*.whl; do
            just wheel-inspect --wheel "$whl" --native-deps
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: AMD64
            msvc_arch: x64
            platform_tag: win_amd64
            vcpkg_triplet: x64-windows
          - runner: windows-11-arm
            arch: ARM64
            msvc_arch: arm64
            platform_tag: win_arm64
            vcpkg_triplet: arm64-windows
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_ROOT: C:/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,C:/vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: C:/vcpkg-binary-cache
          key: ${{ matrix.runner }}-${{ matrix.vcpkg_triplet }}-wheel-vcpkg-binary-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ matrix.runner }}-${{ matrix.vcpkg_triplet }}-wheel-vcpkg-binary-
            ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-wheel-vcpkg-binary-
            ${{ runner.os }}-wheel-vcpkg-binary-
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-wheel-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-wheel-vcpkg-
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path "$env:VCPKG_ROOT")) {
            git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          }
          if (!(Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
          }
      - name: Dependencies
        shell: pwsh
        run: |
          choco install just cmake ninja jq ccache -y
          python -m pip install -U pip build delvewheel
          Get-Command ccache
          python -c "import delvewheel"
      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --triplet ${{ matrix.vcpkg_triplet }} `
            --x-install-root="$PWD/build/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve glslangValidator
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path "build/vcpkg_installed" -Recurse -Filter "glslangValidator.exe" -File |
            Select-Object -First 1
          if (!$validator) {
            Get-ChildItem -Path "build/vcpkg_installed" -Recurse -Depth 4 |
              Select-Object FullName
            Write-Error "glslangValidator.exe not found under build/vcpkg_installed"
          }
          $validatorPath = $validator.FullName.Replace('\', '/')
          "DVZ_GLSLANG_VALIDATOR=$validatorPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $validator.FullName --version
      - name: Build native artifacts
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build",
            "-GNinja",
            "-DCMAKE_BUILD_TYPE=Debug",
            "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
            "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
            "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}",
            "-DDVZ_ENABLE_SHADERC=ON",
            "-DDVZ_BUILD_TESTING=OFF",
            "-DDVZ_BUILD_EXAMPLES=OFF",
            "-DDVZ_CANVAS_SHADER_GLSLANG_VALIDATOR=$env:DVZ_GLSLANG_VALIDATOR"
          )
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import pathlib
          import struct
          import sys

          expected = "${{ matrix.arch }}"
          dlls = list(pathlib.Path("build").rglob("*datoviz*.dll"))
          if not dlls:
              raise SystemExit("no Datoviz DLL found in build/")
          data = dlls[0].read_bytes()
          pe_offset = struct.unpack_from("<I", data, 0x3C)[0]
          machine = struct.unpack_from("<H", data, pe_offset + 4)[0]
          actual = {0x8664: "AMD64", 0xAA64: "ARM64"}.get(machine, hex(machine))
          print(f"{dlls[0]} machine={actual}")
          if actual != expected:
              raise SystemExit(f"expected {expected}, got {actual}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          just ctypes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build wheels
        shell: pwsh
        run: |
          $runtimeDirs = @(
            "$PWD/build/vcpkg_installed/${{ matrix.vcpkg_triplet }}/bin",
            "$PWD/build/vcpkg_installed/${{ matrix.vcpkg_triplet }}/debug/bin"
          ) -join [IO.Path]::PathSeparator
          "DVZ_WHEEL_RUNTIME_DIRS=$runtimeDirs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:DVZ_WHEEL_RUNTIME_DIRS = $runtimeDirs
          python tools/release_wheels/stage_wheel.py --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_wheels/build_wheel.py `
            --dist-dir wheelhouse `
            --platform-tag ${{ matrix.platform_tag }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect wheels
        shell: pwsh
        run: |
          foreach ($whl in Get-ChildItem wheelhouse/*.whl) {
            just wheel-inspect --wheel "$whl" --native-deps
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-${{ matrix.arch }}
          path: wheelhouse/*.whl

  linux-python-smoke:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies
        run: python -m pip install -U pip wheel tomli
      - name: Installed wheel smoke
        run: python tools/release_wheels/check_wheel.py --wheel wheelhouse/*.whl --cmake-consumer --qt-probe optional

  linux-python-prerelease-smoke:
    needs: linux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15-dev"
          allow-prereleases: true
      - name: Dependencies
        run: python -m pip install -U pip wheel tomli
      - name: Installed wheel smoke
        run: python tools/release_wheels/check_wheel.py --wheel wheelhouse/*.whl --cmake-consumer --qt-probe optional

  macos-python-smoke:
    needs: macos
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        target:
          - runner: macos-13
            arch: x86_64
          - runner: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-macos-${{ matrix.target.arch }}
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies
        run: |
          brew install ninja
          python -m pip install -U pip wheel tomli
      - name: Installed wheel smoke
        run: python tools/release_wheels/check_wheel.py --wheel wheelhouse/*.whl --cmake-consumer --qt-probe optional

  windows-python-smoke:
    needs: windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-windows-AMD64
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies
        shell: pwsh
        run: |
          choco install ninja -y
          python -m pip install -U pip wheel tomli
      - name: Installed wheel smoke
        shell: pwsh
        run: python tools/release_wheels/check_wheel.py --wheel wheelhouse/*.whl --cmake-consumer --qt-probe optional

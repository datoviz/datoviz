name: "Wheels"

on:
  workflow_dispatch:

env:
  # Build once per platform; Datoviz is Python-ABI independent and the backend emits
  # py3-none-<platform> directly. Separate install-smoke jobs cover Python 3.10 through 3.14,
  # with 3.15 prerelease enabled only for nightly/prerelease checks.
  DVZ_CMAKE_ARGS: "-DDVZ_ENABLE_SHADERC=ON -DDVZ_MIMALLOC_SOURCE=OFF -DDVZ_VALIDATE_SPIRV=ON -DDVZ_REQUIRE_PRECOMPILED_SHADERS=ON"

permissions:
  contents: read

jobs:
  matrix:
    name: "Resolve wheel matrix"
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.matrix.outputs.json }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: |
          python tools/release_wheels/wheel_matrix.py --json > matrix.json
          echo "json=$(python -c 'import json; print(json.dumps(json.load(open("matrix.json"))))')" >> "$GITHUB_OUTPUT"

  python-bindings:
    name: "Generate Python bindings"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generate Python bindings
        run: |
          python -m pip install -U pip libclang pyyaml
          clang --version
          python tools/bindings/extract_api.py --clang clang
          python tools/bindings/generate_ctypes.py
          python tools/bindings/generate_array_facade.py
          test -f datoviz/_ctypes.py
          test -f datoviz/_array_facade.py
      - uses: actions/upload-artifact@v7
        with:
          name: python-bindings
          path: |
            build/bindings/datoviz_api.json
            datoviz/_ctypes.py
            datoviz/_array_facade.py

  linux:
    name: "Build / Linux ${{ matrix.arch }}"
    needs: [matrix, python-bindings]
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/pypa/manylinux_2_34_${{ matrix.arch }}:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            platform_tag: manylinux_2_34_x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            platform_tag: manylinux_2_34_aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Initialize source dependencies
        shell: bash
        run: >-
          git submodule update --init --recursive
          external/cglm external/cimgui external/glfw external/kvazaar external/mimalloc
          external/msdf-atlas-gen
      - uses: actions/download-artifact@v8
        with:
          name: python-bindings
          path: .
      - name: Build, inspect, and smoke-test manylinux wheel
        env:
          DVZ_CMAKE_ARGS: "-DDVZ_ENABLE_SHADERC=ON -DDVZ_MIMALLOC_SOURCE=OFF -DDVZ_BUILD_TESTING=OFF -DDVZ_BUILD_EXAMPLES=OFF -DDVZ_VALIDATE_SPIRV=ON -DDVZ_REQUIRE_PRECOMPILED_SHADERS=ON"
        run: |
          bash tools/release_wheels/manylinux_build_inside.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl

  macos:
    name: "Build / macOS ${{ matrix.arch }}"
    needs: python-bindings
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            platform_tag: macosx_15_0_x86_64
            deployment_target: "15.0"
          - runner: macos-15
            arch: arm64
            platform_tag: macosx_15_0_arm64
            deployment_target: "15.0"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      DVZ_CMAKE_ARGS: "-DDVZ_ENABLE_SHADERC=ON -DDVZ_MIMALLOC_SOURCE=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }} -DDVZ_VALIDATE_SPIRV=ON -DDVZ_REQUIRE_PRECOMPILED_SHADERS=ON"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Initialize source dependencies
        shell: bash
        run: >-
          git submodule update --init --recursive
          external/cglm external/cimgui external/glfw external/kvazaar external/mimalloc
          external/msdf-atlas-gen
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Dependencies
        run: |
          brew install just ccache ninja jq shaderc spirv-tools vulkan-headers vulkan-loader molten-vk freetype tinyxml2
          python -m pip install -U pip build delocate
          command -v spirv-val
          command -v delocate-listdeps
      - uses: actions/download-artifact@v8
        with:
          name: python-bindings
          path: .
      - name: Check generated Python bindings
        run: |
          test -f datoviz/_ctypes.py
          test -f datoviz/_array_facade.py
      - name: Build native artifacts
        run: |
          just build Release
      - name: Build wheels
        run: |
          export DVZ_WHEEL_RUNTIME_DIRS="$(brew --prefix shaderc)/lib:$(brew --prefix vulkan-loader)/lib:$(brew --prefix molten-vk)/lib:$(brew --prefix molten-vk)/share/vulkan/icd.d"
          python -m pip wheel . --no-deps -w wheelhouse \
            -C datoviz.release-wheel=true \
            -C datoviz.platform-tag=${{ matrix.platform_tag }}
      - name: Inspect wheels
        run: |
          for whl in wheelhouse/*.whl; do
            just wheel-inspect --wheel "$whl" --native-deps
          done
      - name: Installed standalone wheel smoke
        run: |
          brew unlink vulkan-loader
          brew unlink molten-vk
          wheel=$(find wheelhouse -maxdepth 1 -name '*.whl' -print -quit)
          example_profile=basic
          render_args=()
          # The standard Intel VM has no GPU/Metal acceleration; physical Intel owns render proof.
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            example_profile=render
            render_args=(--render --window)
          fi
          env -u VULKAN_SDK \
            -u VK_ICD_FILENAMES \
            -u VK_DRIVER_FILES \
            -u VK_LAYER_PATH \
            -u DYLD_LIBRARY_PATH \
            -u DYLD_FALLBACK_LIBRARY_PATH \
            python tools/release_wheels/check_wheel.py \
              --wheel "$wheel" \
              --release-build \
              --precompiled-shaders \
              --shaderc \
              "${render_args[@]}" \
              --cmake-consumer \
              --examples "$example_profile"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl

  windows:
    name: "Build / Windows ${{ matrix.arch }}"
    needs: python-bindings
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: AMD64
            cmake_processor: AMD64
            msvc_arch: x64
            platform_tag: win_amd64
            vcpkg_triplet: x64-windows
          - runner: windows-11-arm
            arch: ARM64
            cmake_processor: ARM64
            msvc_arch: arm64
            platform_tag: win_arm64
            vcpkg_triplet: arm64-windows
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_ROOT: C:/vcpkg
      VCPKG_NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      VCPKG_BINARY_SOURCES: clear;files,C:/vcpkg-binary-cache,readwrite;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Initialize source dependencies
        shell: bash
        run: >-
          git submodule update --init --recursive
          external/cglm external/cimgui external/glfw external/kvazaar external/mimalloc
          external/msdf-atlas-gen
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Restore vcpkg binary archives
        id: vcpkg-binary-cache
        uses: actions/cache/restore@v6
        with:
          path: C:/vcpkg-binary-cache
          key: ${{ matrix.runner }}-${{ matrix.vcpkg_triplet }}-wheel-vcpkg-binary-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ matrix.runner }}-${{ matrix.vcpkg_triplet }}-wheel-vcpkg-binary-
            ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-wheel-vcpkg-binary-
            ${{ runner.os }}-wheel-vcpkg-binary-
      - name: Restore vcpkg installed tree
        id: vcpkg-installed-cache
        uses: actions/cache/restore@v6
        with:
          path: build/vcpkg_installed
          key: ${{ matrix.runner }}-${{ matrix.vcpkg_triplet }}-wheel-vcpkg-installed-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ matrix.runner }}-${{ matrix.vcpkg_triplet }}-wheel-vcpkg-installed-
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path "$env:VCPKG_ROOT")) {
            git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          }
          if (!(Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
          }
      - name: Configure GitHub Packages NuGet cache
        shell: pwsh
        env:
          VCPKG_PAT_TOKEN: ${{ secrets.VCPKG_PAT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_PAT_TOKEN)) {
            throw "VCPKG_PAT_TOKEN is required for the GitHub Packages vcpkg cache"
          }
          $nuget = & "$env:VCPKG_ROOT/vcpkg.exe" fetch nuget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nuget sources add `
            -Name "datoviz-vcpkg" `
            -Source "$env:VCPKG_NUGET_FEED" `
            -UserName "${{ github.repository_owner }}" `
            -Password "$env:VCPKG_PAT_TOKEN" `
            -StorePasswordInClearText
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nuget setapikey "$env:VCPKG_PAT_TOKEN" -Source "$env:VCPKG_NUGET_FEED"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependencies
        shell: pwsh
        run: |
          choco install just cmake ninja jq ccache -y
          python -m pip install -U pip build delvewheel libclang
          Get-Command ccache
          python -c "import delvewheel"
          python -c "from clang import cindex; print(cindex.Config.library_path)"
      - uses: actions/download-artifact@v8
        with:
          name: python-bindings
          path: .
      - name: Check generated Python bindings
        shell: pwsh
        run: |
          if (!(Test-Path "datoviz/_ctypes.py")) { throw "datoviz/_ctypes.py is missing" }
          if (!(Test-Path "datoviz/_array_facade.py")) { throw "datoviz/_array_facade.py is missing" }
      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --triplet ${{ matrix.vcpkg_triplet }} `
            --x-install-root="$PWD/build/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save vcpkg binary archives
        if: steps.vcpkg-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:/vcpkg-binary-cache
          key: ${{ matrix.runner }}-${{ matrix.vcpkg_triplet }}-wheel-vcpkg-binary-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Save vcpkg installed tree
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/vcpkg_installed
          key: ${{ matrix.runner }}-${{ matrix.vcpkg_triplet }}-wheel-vcpkg-installed-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Resolve shader tools
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path "build/vcpkg_installed" -Recurse -Filter "spirv-val.exe" -File |
            Select-Object -First 1
          $glslc = Get-ChildItem -Path "build/vcpkg_installed" -Recurse -Filter "glslc.exe" -File |
            Select-Object -First 1
          if (!$validator -or !$glslc) {
            Get-ChildItem -Path "build/vcpkg_installed" -Recurse -Depth 4 |
              Select-Object FullName
            Write-Error "spirv-val.exe or glslc.exe not found under build/vcpkg_installed"
          }
          $validatorPath = $validator.FullName.Replace('\', '/')
          $glslcPath = $glslc.FullName.Replace('\', '/')
          "DVZ_SPIRV_VAL=$validatorPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DVZ_GLSLC=$glslcPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $validator.FullName --version
          & $glslc.FullName --version
      - name: Build native artifacts
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build",
            "-GNinja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
            "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
            "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DCMAKE_SYSTEM_NAME=Windows",
            "-DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_processor }}",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}",
            "-DVCPKG_INSTALLED_DIR=$PWD/build/vcpkg_installed",
            "-DDVZ_ENABLE_SHADERC=ON",
            "-DDVZ_MIMALLOC_SOURCE=OFF",
            "-DDVZ_BUILD_TESTING=OFF",
            "-DDVZ_BUILD_EXAMPLES=OFF",
            "-DGLSLC=$env:DVZ_GLSLC",
            "-DDVZ_SPIRV_VAL_EXECUTABLE=$env:DVZ_SPIRV_VAL",
            "-DDVZ_VALIDATE_SPIRV=ON",
            "-DDVZ_REQUIRE_PRECOMPILED_SHADERS=ON"
          )
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import pathlib
          import struct
          import sys

          expected = "${{ matrix.arch }}"
          dlls = list(pathlib.Path("build").rglob("*.dll"))
          if not dlls:
              raise SystemExit("no DLL found in build/")
          for dll in dlls:
              data = dll.read_bytes()
              pe_offset = struct.unpack_from("<I", data, 0x3C)[0]
              machine = struct.unpack_from("<H", data, pe_offset + 4)[0]
              actual = {0x8664: "AMD64", 0xAA64: "ARM64"}.get(machine, hex(machine))
              print(f"{dll} machine={actual}")
              if actual != expected:
                  raise SystemExit(f"{dll}: expected {expected}, got {actual}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build wheels
        shell: pwsh
        run: |
          $runtimeDirs = @(
            "$PWD/build/vcpkg_installed/${{ matrix.vcpkg_triplet }}/bin",
            "$PWD/build/vcpkg_installed/${{ matrix.vcpkg_triplet }}/debug/bin"
          ) -join [IO.Path]::PathSeparator
          "DVZ_WHEEL_RUNTIME_DIRS=$runtimeDirs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:DVZ_WHEEL_RUNTIME_DIRS = $runtimeDirs
          python tools/release_wheels/stage_wheel.py --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_wheels/build_wheel.py `
            --dist-dir wheelhouse `
            --platform-tag ${{ matrix.platform_tag }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect wheels
        shell: pwsh
        run: |
          foreach ($whl in Get-ChildItem wheelhouse/*.whl) {
            $wheelPath = $whl.FullName.Replace('\', '/')
            just wheel-inspect --wheel "$wheelPath" --native-deps
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Installed wheel shader-resource, shaderc, and render smoke
        shell: pwsh
        run: |
          $wheel = Get-ChildItem wheelhouse/*.whl | Select-Object -First 1
          if (!$wheel) { throw "no wheel found in wheelhouse" }
          $wheelPath = $wheel.FullName.Replace('\\', '/')
          python tools/release_wheels/check_wheel.py --wheel "$wheelPath" --release-build --precompiled-shaders --shaderc --render
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-${{ matrix.arch }}
          path: wheelhouse/*.whl

  linux-python-smoke:
    name: "Smoke / Linux x86_64 / Python ${{ matrix.python }}"
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x86_64
          path: wheelhouse
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies
        run: python -m pip install -U pip wheel tomli
      - name: Installed wheel smoke
        run: python tools/release_wheels/check_wheel.py --wheel wheelhouse/*.whl --release-build --precompiled-shaders --cmake-consumer --qt-probe optional

  linux-python-prerelease-smoke:
    name: "Prerelease smoke / Linux x86_64 / Python 3.15"
    needs: linux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x86_64
          path: wheelhouse
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15-dev"
          allow-prereleases: true
      - name: Dependencies
        run: python -m pip install -U pip wheel tomli
      - name: Installed wheel smoke
        run: python tools/release_wheels/check_wheel.py --wheel wheelhouse/*.whl --release-build --precompiled-shaders --cmake-consumer --qt-probe optional

  macos-python-smoke:
    name: "Smoke / macOS ${{ matrix.target.arch }} / Python ${{ matrix.python }}"
    needs: macos
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        target:
          - runner: macos-15-intel
            arch: x86_64
            deployment_target: "15.0"
          - runner: macos-15
            arch: arm64
            deployment_target: "15.0"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target.deployment_target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-macos-${{ matrix.target.arch }}
          path: wheelhouse
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies
        run: |
          brew install ninja
          python -m pip install -U pip wheel tomli
      - name: Installed wheel smoke
        run: python tools/release_wheels/check_wheel.py --wheel wheelhouse/*.whl --release-build --precompiled-shaders --cmake-consumer --qt-probe optional

  windows-python-smoke:
    name: "Smoke / Windows AMD64 / Python ${{ matrix.python }}"
    needs: windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-windows-AMD64
          path: wheelhouse
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies
        shell: pwsh
        run: |
          choco install ninja -y
          python -m pip install -U pip wheel tomli
      - name: Installed wheel smoke
        shell: pwsh
        run: |
          $wheel = Get-ChildItem wheelhouse/*.whl | Select-Object -First 1
          if (!$wheel) { throw "no wheel found in wheelhouse" }
          $wheelPath = $wheel.FullName.Replace('\', '/')
          python tools/release_wheels/check_wheel.py --wheel "$wheelPath" --release-build --precompiled-shaders --cmake-consumer --qt-probe optional

name: "Wheels macOS x86_64"

on:
  workflow_dispatch:

env:
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  DVZ_CMAKE_ARGS: "-DDVZ_ENABLE_SHADERC=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DDVZ_VALIDATE_SPIRV=ON -DDVZ_REQUIRE_PRECOMPILED_SHADERS=ON"

permissions:
  contents: read

jobs:
  python-bindings:
    name: "Generate Python bindings"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generate Python bindings
        run: |
          python -m pip install -U pip libclang pyyaml
          clang --version
          python tools/bindings/extract_api.py --clang clang
          python tools/bindings/generate_ctypes.py
          python tools/bindings/generate_array_facade.py
          test -f datoviz/_ctypes.py
          test -f datoviz/_array_facade.py
      - uses: actions/upload-artifact@v7
        with:
          name: python-bindings
          path: |
            build/bindings/datoviz_api.json
            datoviz/_ctypes.py
            datoviz/_array_facade.py

  macos-x86_64:
    name: "Build / macOS x86_64"
    needs: python-bindings
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Initialize source dependencies
        shell: bash
        run: >-
          git submodule update --init --recursive
          external/cglm external/cimgui external/glfw external/kvazaar external/mimalloc
          external/msdf-atlas-gen
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Dependencies
        run: |
          brew install just ccache ninja jq shaderc spirv-tools vulkan-headers vulkan-loader molten-vk freetype tinyxml2
          python -m pip install -U pip build delocate
          command -v spirv-val
          command -v delocate-listdeps
      - uses: actions/download-artifact@v8
        with:
          name: python-bindings
          path: .
      - name: Check generated Python bindings
        run: |
          test -f datoviz/_ctypes.py
          test -f datoviz/_array_facade.py
      - name: Build native artifacts
        run: just build
      - name: Build wheel
        run: |
          export DVZ_WHEEL_RUNTIME_DIRS="$(brew --prefix shaderc)/lib:$(brew --prefix vulkan-loader)/lib:$(brew --prefix molten-vk)/lib:$(brew --prefix molten-vk)/share/vulkan/icd.d"
          python -m pip wheel . --no-deps -w wheelhouse \
            -C datoviz.release-wheel=true \
            -C datoviz.platform-tag=macosx_15_0_x86_64
      - name: Inspect wheel
        run: |
          for whl in wheelhouse/*.whl; do
            just wheel-inspect --wheel "$whl" --native-deps
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-x86_64
          path: wheelhouse/*.whl

  macos-x86_64-python-smoke:
    name: "Smoke / macOS x86_64 / Python ${{ matrix.python }}"
    needs: macos-x86_64
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-macos-x86_64
          path: wheelhouse
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies
        run: |
          brew install ninja
          python -m pip install -U pip wheel tomli
      - name: Installed wheel smoke
        run: python tools/release_wheels/check_wheel.py --wheel wheelhouse/*.whl --cmake-consumer --qt-probe optional
